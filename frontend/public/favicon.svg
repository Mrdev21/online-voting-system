<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="#0F172A"/>

  <!-- Ballot Box -->
  <rect x="16" y="28" width="32" height="20" rx="3"
        fill="none"
        stroke="url(#grad)"
        stroke-width="3"/>

  <!-- Ballot -->
  <rect x="23" y="12" width="18" height="18" rx="2"
        fill="white"
        transform="rotate(-10 32 21)"/>

  <!-- Check Mark -->
  <path d="M27 21 L31 25 L38 17"
        fill="none"
        stroke="#22C55E"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Slot -->
  <line x1="22" y1="31" x2="42" y2="31"
        stroke="url(#grad)"
        stroke-width="2"/>
</svg>